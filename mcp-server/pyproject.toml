[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iflyskills-mcp"
version = "0.1.0"
description = "MCP server exposing iFLYTEK skills (TTS, OCR, translation, ASR, multimodal)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "iFLYTEK" }]
dependencies = [
    "mcp>=1.2.0",
    "iflyskills-core",
]

[project.scripts]
iflyskills-mcp = "iflyskills_mcp.server:main"

[tool.setuptools]
packages = ["iflyskills_mcp"]
