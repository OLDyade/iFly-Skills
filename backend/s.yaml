# Serverless Devs descriptor for Aliyun Function Compute (FC 3.0).
# Deploy:  s deploy   (after `npm i -g @serverless-devs/s` and `s config add`)
edition: 3.0.0
name: iflyskills-backend
access: default

vars:
  region: cn-hangzhou

resources:
  backend:
    component: fc3
    props:
      region: ${vars.region}
      functionName: iflyskills-backend
      description: iFLYTEK skills HTTP gateway (Coze plugins + IM bots)
      runtime: custom-container
      timeout: 600
      memorySize: 1024
      port: 8000
      environmentVariables:
        IFLYTEK_APP_ID: ${env.IFLYTEK_APP_ID}
        IFLYTEK_API_KEY: ${env.IFLYTEK_API_KEY}
        IFLYTEK_API_SECRET: ${env.IFLYTEK_API_SECRET}
        PUBLIC_BASE_URL: ${env.PUBLIC_BASE_URL}
        IFLY_ARTIFACT_DIR: /tmp/iflyskills-artifacts
      customContainerConfig:
        # Build from backend/Dockerfile (context = repo root) and
        # push to ACR, then reference the image here.
        image: ${env.ACR_IMAGE}
      triggers:
        - triggerName: http
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
