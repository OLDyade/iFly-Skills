[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iflyskills-core"
version = "0.1.0"
description = "Shared registry, credential shim, and runner for distributing iFly-Skills."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "iFLYTEK" }]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["iflyskills_core"]
include-package-data = true

[tool.setuptools.package-data]
iflyskills_core = ["../skills.yaml"]
